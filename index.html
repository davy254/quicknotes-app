<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Notes App</h1>
    <p>Capture your thoughts, sorted and searchable.</p>
  </header>

  <main>
    <section id="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input type="text" id="note-input" name="note" placeholder="Write something...">

        <label for="note-category">Category</label>
        <select id="note-category" name="category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section id="notes-section">
      <h2>Your notes</h2>
      <label for="search-input">Search notes</label>
      <input type="search" id="search-input" placeholder="Search...">
      <p id="note-count"></p>
      <button type="button" id="clear-all">Clear all</button>      
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Notes App</p>
  </footer>
</body>
</html>
